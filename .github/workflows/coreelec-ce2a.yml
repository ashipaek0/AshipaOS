name: coreelec-ce2a
# CE-2A: build the pinned stock CoreELEC Generic image and record read-only
# evidence about it. A full CoreELEC build takes hours, so it runs on demand
# only; its static and negative gates also run in tests/static/run-static.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ce2a:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AshipaOS
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install userspace inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq gzip fdisk mtools device-tree-compiler python3-jsonschema

      - name: Static and negative gates (before build)
        run: |
          bash tests/static/test-coreelec-ce2a.sh
          bash tests/negative/test-coreelec-ce2a.sh

      - name: Validate pinned source metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/coreelec/validate-pin.sh build/coreelec/pin.json

      - name: Build pinned CoreELEC Generic image (CI only)
        env:
          CI: true
        run: |
          mkdir -p output/ce2a/evidence
          bash build/coreelec/ce2a-build.sh --ci build/coreelec/pin.json output/ce2a/workspace output/ce2a/evidence

      # The DTB is taken from the built image's own FAT boot partition, read-only.
      - name: Extract target DTB from the Generic image
        run: |
          image=output/ce2a/evidence/CoreELEC-Amlogic-ng.arm-21.3-Omega-Generic.img.gz
          raw="$RUNNER_TEMP/generic.img"
          gzip -dc -- "$image" > "$raw"
          start=$(sfdisk -J "$raw" | jq -er '.partitiontable.partitions[0].start')
          MTOOLS_SKIP_CHECK=1 mcopy -n -i "$raw@@$((start * 512))" \
            ::device_trees/sm1_s905x3_4g_1gbit.dtb output/ce2a/sm1_s905x3_4g_1gbit.dtb
          rm -f -- "$raw"

      - name: Inspect Generic image (read-only)
        run: |
          CE2A_DTB_SHA256="$(sha256sum output/ce2a/sm1_s905x3_4g_1gbit.dtb | cut -d' ' -f1)"
          export CE2A_DTB_SHA256
          bash build/coreelec/ce2a-inspect-image.sh \
            output/ce2a/evidence/CoreELEC-Amlogic-ng.arm-21.3-Omega-Generic.img.gz \
            build/coreelec/pin.json \
            output/ce2a/sm1_s905x3_4g_1gbit.dtb \
            output/ce2a/inspection

      - name: Validate generated CE-2A manifest
        run: |
          python3 build/coreelec/validate-ce2a-manifest.py \
            output/ce2a/inspection/ce2a-manifest.json \
            schemas/coreelec-ce2a-manifest.schema.json \
            build/coreelec/pin.json

      - name: Upload CE-2A evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coreelec-ce2a-evidence
          # The source workspace is tens of GB of build tree; upload evidence only.
          path: |
            output/ce2a/evidence/
            output/ce2a/inspection/
            output/ce2a/sm1_s905x3_4g_1gbit.dtb
          if-no-files-found: warn
          retention-days: 30
