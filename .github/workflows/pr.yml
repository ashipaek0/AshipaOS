name: pr
on:
  pull_request:
    branches: [main, A95XF3-Air]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gpg shellcheck python3-yaml python3-jsonschema python3-packaging \
            fdisk dosfstools mtools e2fsprogs u-boot-tools device-tree-compiler busybox curl

      # Same entry point as build-images.yml, so PR and release gates cannot drift.
      # Includes the Layer 1/2 usage, config and layout contracts.
      - name: Run static gates
        run: bash tests/static/run-static.sh

      - name: Validate immutable CoreELEC pin against authorized fork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/coreelec/validate-pin.sh
