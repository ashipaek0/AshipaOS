name: pr
on:
  pull_request:
    branches: [main]

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support parted kpartx gpg jq shellcheck

      - name: Run static tests
        run: |
          echo "=== Running Static Tests ==="
          for layer in layers/layer*/; do
            if [ -f "${layer}tests/static-tests.sh" ]; then
              echo "Testing ${layer}"
              bash "${layer}tests/static-tests.sh"
            fi
          done
      
      - name: Validate JSON schemas
        run: |
          echo "=== Validating JSON Schemas ==="
          for schema in schemas/*.json; do
            echo "Validating against $schema"
            # Find corresponding config files and validate
          done
      
      - name: Smoke test Layer 1 (rootfs)
        run: |
          echo "=== Building Layer 1 RootFS (Smoke Test) ==="
          bash layers/layer1-rootfs/build-rootfs.sh build x86_64
      
      - name: Smoke test Layer 2 (image)
        run: |
          echo "=== Building Layer 2 Image (Smoke Test) ==="
          bash layers/layer2-image/build-image.sh build x86_64
      
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: output/evidence/
          retention-days: 30
