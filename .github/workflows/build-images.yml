name: build-images
permissions:
  contents: read
on:
  push:
    branches:
      - A95XF3-Air  # Development build from this branch; no release job.
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Development run: write PLACEHOLDER signatures when no release key is configured (never for tags)'
        required: false
        default: false
        type: boolean

# One build per ref; a newer run supersedes an older one.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail on every step.
    shell: bash

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gpg shellcheck python3-yaml python3-jsonschema python3-packaging \
            fdisk dosfstools mtools e2fsprogs u-boot-tools device-tree-compiler busybox curl

      # Same entry point as pr.yml, so PR and release gates cannot drift.
      - name: Run static gates
        run: bash tests/static/run-static.sh

      - name: Validate immutable CoreELEC pin against authorized fork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/coreelec/validate-pin.sh

  build-a95x-f3-air:
    needs: static-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ROOTFS: output/rootfs-a95x-f3-air.tar.gz
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            python3-yaml python3-packaging gpg \
            fdisk dosfstools mtools e2fsprogs u-boot-tools
          sudo update-binfmts --enable qemu-aarch64
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Secrets are passed through env, never interpolated into the script text.
      - name: Configure GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::GPG_PRIVATE_KEY is required for tag releases"
              exit 1
            fi
            echo "::warning::GPG_PRIVATE_KEY not set; signing fails unless 'allow_unsigned' was selected"
            exit 0
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

      - name: Build Layer 1 (rootfs)
        run: bash layers/layer1-rootfs/scripts/build-rootfs.sh arm64 "$ROOTFS" a95x-f3-air

      - name: Resolve and probe Layer 5 closure (arm64 under qemu)
        run: |
          python3 layers/layer5-application/scripts/jellyfin-bundle.py resolve \
            --rootfs "$ROOTFS" \
            --artifacts-dir output/layer5-artifacts \
            --output output/evidence/layer5-resolution.json

      - name: Build Layer 5 (application bundle)
        run: |
          bash layers/layer5-application/scripts/build-application.sh \
            "$ROOTFS" a95x-f3-air output/evidence/layer5-resolution.json output/layer5-artifacts

      - name: Build Layer 2 (disk image)
        run: |
          bash layers/layer2-image/tests/layout-tests.sh
          bash layers/layer2-image/scripts/build-image.sh "$ROOTFS" a95x-f3-air

      - name: Gate A95X image contents
        run: |
          image=$(find output/images -maxdepth 1 -type f -name 'ashipaos-a95x-f3-air-*.img' -print -quit)
          [[ -n "$image" ]] || { echo '::error::A95X image not found; content gate cannot be skipped'; exit 1; }
          bash layers/layer2-image/tests/image-content-tests.sh "$image"

      - name: Build Layer 10 (release artefacts)
        run: bash layers/layer10-release/scripts/build-10-release.sh a95x-f3-air

      - name: Generate SBOM
        run: bash scripts/ci-generate-sbom.sh output/sbom.json "$ROOTFS" output/images

      - name: Sign artefacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Explicit, visible opt-in for development runs only. Tags never get placeholders.
          CI_ALLOW_PLACEHOLDER_SIGNATURES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/A95XF3-Air') && '1' || (github.event_name == 'workflow_dispatch' && inputs.allow_unsigned && '1' || '0') }}
        run: bash scripts/ci-sign-artefacts.sh output/images output/sbom.json

      - name: Upload release artefacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ashipaos-a95x-f3-air-${{ github.run_id }}
          # A build that produced no image must fail, not upload an empty bundle.
          if-no-files-found: error
          path: |
            output/images/*.img.gz
            output/images/*.img.gz.asc
            output/images/SHA256SUMS-*
            output/sbom.json
            output/sbom.json.asc
            output/evidence/
          retention-days: 90

      # Keep evidence from failed runs so a failure can be diagnosed without a re-run.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: build-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            output/evidence/
            output/images/*.meta.json
          retention-days: 14

  create-release:
    needs: build-a95x-f3-air
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: ashipaos-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (dev|alpha|beta|rc) ]]; then
            prerelease+=(--prerelease)
          fi
          mapfile -d '' assets < <(
            find images -maxdepth 1 -type f \
              \( -name '*.img.gz' -o -name '*.img.gz.asc' -o -name 'SHA256SUMS-*' \) -print0
          )
          assets+=(sbom.json sbom.json.asc)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "${prerelease[@]}" \
            "${assets[@]}"
