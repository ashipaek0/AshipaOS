name: build-images
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - a95x-f3-air

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install static-test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          jq python3-jsonschema python3-yaml ripgrep shellcheck
      - name: Require schema validators
        run: python3 -c 'import jsonschema, yaml'
      - name: Run layer and repository static tests
        run: |
          for layer in layers/layer*/; do
            if [ -f "${layer}tests/static-tests.sh" ]; then
              echo "=== ${layer} ==="
              bash "${layer}tests/static-tests.sh"
            fi
          done
          for test in tests/static/*.sh; do
            echo "=== ${test} ==="
            bash "$test"
          done
      - name: Record static evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p evidence/ci
          jq -n \
            --arg task 'layer0.static-validation' \
            --arg class STATIC \
            --arg runner github-actions \
            --arg target all \
            --arg result "$RESULT" \
            --arg evidence 'GitHub Actions job log' \
            --arg timestamp "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            '{task:$task,class:$class,runner:$runner,target:$target,result:$result,evidence:$evidence,timestamp:$timestamp,commit:$commit,run:$run,job:$job}' \
            > evidence/ci/static.json
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-images-static-evidence-${{ github.run_id }}
          path: evidence/ci/static.json
          if-no-files-found: error

  build-x86_64:
    needs: static-tests
    if: github.event_name == 'push' || inputs.target == 'x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build and VM dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          debootstrap dosfstools e2fsprogs grub-efi-amd64-bin jq ovmf parted
          python3-jsonschema python3-yaml qemu-system-x86 ripgrep rsync zstd
      - name: Build and verify x86_64 development release
        run: sudo build/scripts/build-release.sh x86_64 0.0.1-dev
      - name: Record build evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p evidence/ci
          jq -n \
            --arg task 'layer1-2.x86_64-development-image' \
            --arg class BUILD \
            --arg runner github-actions \
            --arg target x86_64 \
            --arg result "$RESULT" \
            --arg evidence 'build/output and GitHub Actions job log' \
            --arg timestamp "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            '{task:$task,class:$class,runner:$runner,target:$target,result:$result,evidence:$evidence,timestamp:$timestamp,commit:$commit,run:$run,job:$job}' \
            > evidence/ci/x86_64-build.json
      - name: Record VM evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          jq -n \
            --arg task 'layer1-2.x86_64-vm-boot' \
            --arg class VM \
            --arg runner github-actions \
            --arg target x86_64 \
            --arg result "$RESULT" \
            --arg evidence 'QEMU boot output in GitHub Actions job log' \
            --arg timestamp "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            '{task:$task,class:$class,runner:$runner,target:$target,result:$result,evidence:$evidence,timestamp:$timestamp,commit:$commit,run:$run,job:$job}' \
            > evidence/ci/x86_64-vm.json
      - name: Upload development image and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashipaos-x86_64-${{ github.sha }}
          path: |
            build/output/ashipaos-x86_64.img.zst
            build/output/ashipaos-x86_64.img.zst.sha256
            build/output/ashipaos-x86_64.manifest.json
            build/output/ashipaos-x86_64.packages.lock
            evidence/ci/x86_64-build.json
            evidence/ci/x86_64-vm.json
          if-no-files-found: error

  amlogic-hardware-gate:
    needs: static-tests
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'a95x-f3-air'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record blocked hardware verification
        run: |
          mkdir -p evidence/ci
          jq -n \
            --arg task 'amlogic.a95x-f3-air-hardware-validation' \
            --arg class HARDWARE \
            --arg runner blocked \
            --arg target a95x-f3-air \
            --arg result blocked \
            --arg evidence 'No hardware-lab evidence is available' \
            --arg timestamp "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg job "$GITHUB_JOB" \
            '{task:$task,class:$class,runner:$runner,target:$target,result:$result,evidence:$evidence,timestamp:$timestamp,commit:$commit,run:$run,job:$job}' \
            > evidence/ci/a95x-f3-air-hardware.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a95x-f3-air-blocked-evidence-${{ github.run_id }}
          path: evidence/ci/a95x-f3-air-hardware.json
          if-no-files-found: error
