name: build-images
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device (x86_64, a95x-f3-air)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - a95x-f3-air

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support parted kpartx gpg jq shellcheck

      - name: Run static tests
        run: |
          echo "=== Running Static Tests ==="
          for layer in layers/layer*/; do
            if [ -f "${layer}tests/static-tests.sh" ]; then
              echo "Testing ${layer}"
              bash "${layer}tests/static-tests.sh"
            fi
          done

  build-x86_64:
    needs: static-tests
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'x86_64' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support parted kpartx gpg jq

      - name: Configure GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> $GITHUB_ENV

      - name: Build Layer 1 (RootFS)
        run: |
          bash layers/layer1-rootfs/build-rootfs.sh build x86_64

      - name: Build Layer 2 (Disk Image)
        run: |
          bash layers/layer2-image/build-image.sh build x86_64

      - name: Build Layer 3 (First-Boot Init)
        run: |
          bash layers/layer3-init/build-init.sh build x86_64

      - name: Build Layer 4 (System Services)
        run: |
          bash layers/layer4-services/build-services.sh build x86_64

      - name: Build Layer 5 (Settings Daemon)
        run: |
          bash layers/layer5-settingsd/build-settingsd.sh build x86_64

      - name: Build Layer 6 (OTA Mechanism)
        run: |
          bash layers/layer6-ota/build-ota.sh build x86_64

      - name: Build Layer 10 (Release Engineering)
        run: |
          bash layers/layer10-release/build-release.sh build x86_64

      - name: Sign Artefacts
        run: |
          bash scripts/ci-sign-artefacts.sh output/images/ output/ota/

      - name: Generate SBOM
        run: |
          bash scripts/ci-generate-sbom.sh output/sbom.json

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: ashipaos-x86_64-${{ github.ref_name }}
          path: |
            output/images/*.img.gz
            output/ota/*.pkg
            output/sbom.json
          retention-days: 90

  build-a95x-f3-air:
    needs: static-tests
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'a95x-f3-air' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support parted kpartx gpg jq u-boot-tools

      - name: Configure GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> $GITHUB_ENV

      - name: Build Layer 1 (RootFS)
        run: |
          bash layers/layer1-rootfs/build-rootfs.sh build a95x-f3-air

      - name: Build Layer 2 (Disk Image)
        run: |
          bash layers/layer2-image/build-image.sh build a95x-f3-air

      - name: Build Layer 3 (First-Boot Init)
        run: |
          bash layers/layer3-init/build-init.sh build a95x-f3-air

      - name: Build Layer 4 (System Services)
        run: |
          bash layers/layer4-services/build-services.sh build a95x-f3-air

      - name: Build Layer 5 (Settings Daemon)
        run: |
          bash layers/layer5-settingsd/build-settingsd.sh build a95x-f3-air

      - name: Build Layer 6 (OTA Mechanism)
        run: |
          bash layers/layer6-ota/build-ota.sh build a95x-f3-air

      - name: Build Layer 7 (HAL)
        run: |
          bash layers/layer7-hal/build-hal.sh build a95x-f3-air

      - name: Build Layer 8 (Media Framework)
        run: |
          bash layers/layer8-media/build-media.sh build a95x-f3-air

      - name: Build Layer 9 (Input Stack)
        run: |
          bash layers/layer9-input/build-input.sh build a95x-f3-air

      - name: Build Layer 10 (Release Engineering)
        run: |
          bash layers/layer10-release/build-release.sh build a95x-f3-air

      - name: Sign Artefacts
        run: |
          bash scripts/ci-sign-artefacts.sh output/images/ output/ota/

      - name: Generate SBOM
        run: |
          bash scripts/ci-generate-sbom.sh output/sbom.json

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: ashipaos-a95x-f3-air-${{ github.ref_name }}
          path: |
            output/images/*.img.gz
            output/ota/*.pkg
            output/sbom.json
          retention-days: 90

  create-release:
    needs: [build-x86_64, build-a95x-f3-air]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: ashipaos-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.img.gz
            *.pkg
            sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
