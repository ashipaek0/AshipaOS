name: build-images
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device (x86_64, a95x-f3-air)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - a95x-f3-air

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support libguestfs-tools gpg jq shellcheck sfdisk

      - name: Run static tests
        run: |
          echo "=== Running Static Tests ==="
          for layer in layers/layer*/; do
            if [ -f "${layer}tests/static-tests.sh" ]; then
              echo "Testing ${layer}"
              bash "${layer}tests/static-tests.sh"
            fi
          done

  build-x86_64:
    needs: static-tests
    runs-on: ubuntu-latest
    # Note: Uses libguestfs for disk image creation - no privileged mode needed
    if: github.event.inputs.target == 'x86_64' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            qemu-system-arm \
            binfmt-support \
            libguestfs-tools \
            gpg \
            jq \
            shellcheck \
            sfdisk \
            util-linux
          
          # Register QEMU binaries for ARM64 emulation
          sudo update-binfmts --enable qemu-aarch64
          
          # Configure libguestfs to use direct mode (no FUSE needed)
          export LIBGUESTFS_BACKEND=direct

      - name: Configure GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> $GITHUB_ENV

      - name: Build Layer 1 (RootFS)
        run: |
          sudo bash layers/layer1-rootfs/scripts/build-rootfs.sh amd64 output/rootfs-x86_64.tar.gz
          sudo chown "$USER:$USER" output/rootfs-x86_64.tar.gz

      - name: Build Layer 2 (Disk Image)
        run: |
          export LIBGUESTFS_BACKEND=direct
          bash layers/layer2-image/scripts/build-image.sh output/rootfs-x86_64.tar.gz x86_64

      - name: Build Layer 3 (First-Boot Init)
        run: |
          bash layers/layer3-init/scripts/build-init.sh x86_64

      - name: Build Layer 4 (System Services)
        run: |
          bash layers/layer4-services/scripts/build-services.sh x86_64

      - name: Build Layer 5 (Settings Daemon)
        run: |
          bash layers/layer5-settingsd/scripts/build-settingsd.sh x86_64

      - name: Build Layer 6 (OTA Mechanism)
        run: |
          bash layers/layer6-ota/scripts/build-ota.sh x86_64

      - name: Build Layer 10 (Release Engineering)
        run: |
          bash layers/layer10-release/scripts/build-10-release.sh x86_64

      - name: Sign Artefacts
        run: |
          bash scripts/ci-sign-artefacts.sh output/images/ output/ota/

      - name: Generate SBOM
        run: |
          bash scripts/ci-generate-sbom.sh output/sbom.json

      - name: Upload Images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashipaos-x86_64-${{ github.ref_name }}
          path: |
            output/images/*.img.gz
            output/ota/*.pkg
            output/sbom.json
          retention-days: 90

  build-a95x-f3-air:
    needs: static-tests
    runs-on: ubuntu-latest
    # Note: Uses libguestfs + QEMU emulation for ARM64 - no privileged mode needed
    if: github.event.inputs.target == 'a95x-f3-air' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            qemu-system-arm \
            binfmt-support \
            libguestfs-tools \
            gpg \
            jq \
            shellcheck \
            u-boot-tools \
            sfdisk \
            util-linux
          
          # Register QEMU binaries for ARM64 emulation
          sudo update-binfmts --enable qemu-aarch64
          
          # Configure libguestfs to use direct mode (no FUSE needed)
          export LIBGUESTFS_BACKEND=direct

      - name: Configure GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> $GITHUB_ENV

      - name: Build Layer 1 (RootFS)
        run: |
          export QEMU_CPU=max
          sudo bash layers/layer1-rootfs/scripts/build-rootfs.sh arm64 output/rootfs-a95x-f3-air.tar.gz
          sudo chown "$USER:$USER" output/rootfs-a95x-f3-air.tar.gz

      - name: Build Layer 2 (Disk Image)
        run: |
          export LIBGUESTFS_BACKEND=direct
          bash layers/layer2-image/scripts/build-image.sh output/rootfs-a95x-f3-air.tar.gz a95x-f3-air

      - name: Build Layer 3 (First-Boot Init)
        run: |
          bash layers/layer3-init/scripts/build-init.sh a95x-f3-air

      - name: Build Layer 4 (System Services)
        run: |
          bash layers/layer4-services/scripts/build-services.sh a95x-f3-air

      - name: Build Layer 5 (Settings Daemon)
        run: |
          bash layers/layer5-settingsd/scripts/build-settingsd.sh a95x-f3-air

      - name: Build Layer 6 (OTA Mechanism)
        run: |
          bash layers/layer6-ota/scripts/build-ota.sh a95x-f3-air

      - name: Build Layer 7 (HAL)
        run: |
          bash layers/layer7-hal/scripts/build-7-hal.sh a95x-f3-air

      - name: Build Layer 8 (Media Framework)
        run: |
          bash layers/layer8-media/scripts/build-8-media.sh a95x-f3-air

      - name: Build Layer 9 (Input Stack)
        run: |
          bash layers/layer9-input/scripts/build-9-input.sh a95x-f3-air

      - name: Build Layer 10 (Release Engineering)
        run: |
          bash layers/layer10-release/scripts/build-10-release.sh a95x-f3-air

      - name: Sign Artefacts
        run: |
          bash scripts/ci-sign-artefacts.sh output/images/ output/ota/

      - name: Generate SBOM
        run: |
          bash scripts/ci-generate-sbom.sh output/sbom.json

      - name: Upload Images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashipaos-a95x-f3-air-${{ github.ref_name }}
          path: |
            output/images/*.img.gz
            output/ota/*.pkg
            output/sbom.json
          retention-days: 90

  create-release:
    needs: [build-x86_64, build-a95x-f3-air]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Download all artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ashipaos-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.img.gz
            *.pkg
            sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}