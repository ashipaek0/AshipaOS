# AshipaOS appliance defaults, seeded once into /storage; user edits persist.
# Only output/decoder choices live here: mpv.conf overrides options the shim
# sets itself, so window/idle behaviour is left to the shim.
# Runs inside the cage Wayland kiosk compositor.
vo=gpu
gpu-context=wayland
gpu-api=opengl
# The SoC's own decoder (meson_vdec, via V4L2 M2M) first: auto-safe's list
# is CPU-vendor hwaccels (vaapi/vdpau/nvdec/…) that never apply on this ARM
# board, so playback was always software-decoded even though the hardware
# decoder was loaded and idle (evidence/amlogic/a95x-f3-air/boot-2026-09-25b/:
# mpv logs only the CUDA/VDPAU/Vulkan probes auto-safe tries, never v4l2m2m).
# -copy: decoded frames land in system memory, compatible with plain OpenGL.
hwdec=v4l2m2m-copy,auto-safe
ao=alsa
