# AshipaOS appliance defaults, seeded once into /storage; user edits persist.
# Only output/decoder choices live here: mpv.conf overrides options the shim
# sets itself, so window/idle behaviour is left to the shim.
# Runs inside the cage Wayland kiosk compositor.
vo=gpu
gpu-context=wayland
gpu-api=opengl
# Try FFmpeg's V4L2 wrapper, then mpv's safe automatic choices. A decoder
# being compiled in does not prove the kernel supports a particular codec.
# -copy returns frames to system memory for the OpenGL renderer. If this
# path freezes, playback.txt can disable hwdec without changing this file.
hwdec=v4l2m2m-copy,auto-safe
ao=alsa
# Decode to PCM by default. The default ALSA plug device does not negotiate
# receiver codec support or guarantee an IEC61937 passthrough route. Enable
# passthrough explicitly in the shim's audio settings only for a tested AVR.
audio-spdif=
# Give remotes time to release a key before repeating navigation.
input-ar-delay=400
input-ar-rate=5
