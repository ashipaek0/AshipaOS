# Layer 2: A95X F3 Air removable-SD image. build-image.sh reads this file.
image_size_mb: 4096
partition_table: dos
# Sectors 1..8191 stay zero: nothing is written ahead of the boot partition
# (the stock SD U-Boot bundle is never written to the image).
prepartition_gap: {start_sector: 1, end_sector: 8191, contents: zero}
raw_sd_payload_writes: false
partitions:
  boot:
    start_sector: 8192
    size_mb: 256
    mbr_type: "0x0e"  # W95 FAT16 (LBA)
    filesystem: fat16
    label: A95XBOOT
  root:
    start_sector: 532480
    size_mb: 3584
    mbr_type: "0x83"
    filesystem: ext4
    label: RootFS
# Boot chain: stock vendor U-Boot (2015.01, on eMMC, untouched) runs
# aml_autoscript from SD, which runs cfgload, which bootm's kernel.img
# (Android legacy v0: Debian kernel + initramfs) with dtb.img at dtb_addr.
# FAT names are lowercase: vendor U-Boot lower-cases lookups, so an upper-case
# long file name would never match.
boot:
  files: [aml_autoscript, cfgload, kernel.img, dtb.img, manifest.json]
  android_header:
    page_size: 2048
    # Kernel base; the kernel is placed at base + its Image text_offset
    # (0x01080000 for CoreELEC's 4.9 kernel, 0x01000000 for text_offset 0).
    kernel_base: "0x01000000"
    # The kernel image (incl. BSS) must end below the secure-monitor carve-out.
    kernel_limit: "0x05000000"
    ramdisk_addr: "0x0a000000"
    tags_addr: "0x00000100"
  image_load_addr: "0x20000000"  # scratch address kernel.img is fatload'ed to
  dtb_addr: "0x10000000"         # Amlogic U-Boot reads the FDT from dtb_mem_addr
  bootargs: "root=LABEL=RootFS rootwait rw console=tty0 console=ttyAML0,115200"
