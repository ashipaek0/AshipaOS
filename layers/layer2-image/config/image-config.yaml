# Layer 2: Partitioned Disk Image Configuration
# Verification Class: BUILD; VM and HARDWARE are blocked until boot inputs exist

image_size_mb: 4096
filesystem_overhead_percent: 5

partitions:
  efi: 256
  root: 3584

filesystems:
  efi:
    type: vfat
    fat_size: 32
    label: EFI
    mount_point: /boot/efi
  root:
    type: ext4
    label: RootFS
    mount_point: /
    options: "defaults,noatime"

targets:
  a95x-f3-air:
    partition_table: dos
    boot_partition:
      start_sector: 8192
      filesystem: fat16
      label: A95XBOOT
      files: [AML_AUTOSCRIPT, CFGLOAD, KERNEL.IMG, dtb.img, manifest]
    root_partition:
      start_sector: 532480
      filesystem: ext4
      label: RootFS
    boot_contract:
      source: "CoreELEC 21.3-Omega Generic Amlogic image; inspected extracted boot partition"
      kernel_image: android-legacy
      page_size: 2048
      kernel_offset: "0x01080000"
      ramdisk_offset: "0x01000000"
      second_offset: "0x00f00000"
      tags_offset: "0x00000100"
      bootargs: "root=LABEL=RootFS rw console=ttyS0,115200 console=tty0"

bootloader:
  type: uefi
  arch_mapping:
    arm64: BOOTAA64.EFI
    amd64: BOOTX64.EFI
    armhf: BOOTARM.EFI

kernel:
  source: external
  # Kernel provided by target-specific build or package
  install_path: /boot
  dtb_path: /boot/dtbs

testing:
  vm_boot_timeout: 120
  hardware_boot_timeout: 300
  required_tests:
    - partition_integrity
    - filesystem_check
    - fstab_validation
