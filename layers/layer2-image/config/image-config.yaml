# Layer 2: A95X F3 Air FAT16/Android/U-Boot image configuration
image_size_mb: 4096
partitions:
  efi: 256
  root: 3584
filesystems:
  efi:
    type: fat16
    label: A95XBOOT
    mount_point: /boot
  root:
    type: ext4
    label: RootFS
    mount_point: /
target:
  name: a95x-f3-air
  architecture: arm64
  partition_table: dos
  boot_partition:
    start_sector: 8192
    filesystem: fat16
    label: A95XBOOT
    files: [AML_AUTOSCRIPT, CFGLOAD, KERNEL.IMG, dtb.img, manifest]
  root_partition:
    start_sector: 532480
    filesystem: ext4
    label: RootFS
  boot_contract:
    source: CoreELEC 21.3-Omega inspected boot partition
    kernel_image: android-legacy
    page_size: 2048
    kernel_offset: "0x01080000"
    ramdisk_offset: "0x01000000"
    second_offset: "0x00f00000"
    tags_offset: "0x00000100"
    bootargs: "root=LABEL=RootFS rw console=ttyS0,115200 console=tty0"
    prepartition_gap: {start_sector: 1, end_sector: 8191, contents: zero}
    raw_sd_payload_writes: false
