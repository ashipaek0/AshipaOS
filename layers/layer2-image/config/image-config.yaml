# Layer 2: x86_64 UEFI Disk Image Configuration
image_size_mb: 4096
filesystem_overhead_percent: 5
partitions:
  efi: 256
  root: 3584
filesystems:
  efi:
    type: vfat
    fat_size: 32
    label: EFI
    mount_point: /boot/efi
  root:
    type: ext4
    label: RootFS
    mount_point: /
    options: "defaults,noatime"
bootloader:
  type: uefi
  arch_mapping:
    amd64: BOOTX64.EFI
kernel:
  source: external
  install_path: /boot
testing:
  vm_boot_timeout: 120
  hardware_boot_timeout: 300
  required_tests: [partition_integrity, filesystem_check, fstab_validation]
