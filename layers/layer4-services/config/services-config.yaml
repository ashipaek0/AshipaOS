# Layer 4: deterministic systemd core-service policy for x86_64.
# Package installation and source configuration remain owned by Layer 1/3.
# Verification Class: BUILD, VM

target: x86_64
services:
  enabled:
    - systemd-journald.service
    - systemd-logind.service
    - systemd-networkd.service
    - getty@tty1.service
    - ashipaos-display.service
  disabled:
    - bluetooth.service
    - cups.service
    - ModemManager.service

default_target: graphical.target

policy:
  preset_file: /etc/systemd/system-preset/ashipaos.preset
  disable_unlisted: true

testing:
  verify_with_systemd_analyze: true
  required_services:
    - systemd-journald.service
    - systemd-logind.service
    - systemd-networkd.service
    - getty@tty1.service
    - ashipaos-display.service
