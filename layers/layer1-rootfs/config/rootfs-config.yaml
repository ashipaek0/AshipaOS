# Layer 1 Configuration: Minimal Debian Root Filesystem
# This configuration file defines parameters for rootfs generation

debian:
  suite: bookworm
  mirror: http://deb.debian.org/debian
  components:
    - main
    - contrib
    - non-free-firmware

# Architectures to support
architectures:
  - arm64
  - amd64
  - armhf

# Packages to include in minimal rootfs
packages:
  base:
    - base-files
    - base-passwd
    - bash
    - bsdutils
    - coreutils
    - dash
    - debianutils
    - diffutils
    - dpkg
    - e2fsprogs
    - findutils
    - grep
    - gzip
    - hostname
    - init-system-helpers
    - libc6
    - login
    - ncurses-base
    - ncurses-bin
    - perl-base
    - sed
    - sensible-utils
    - sysvinit-utils
    - tar
    - util-linux
  
  essential:
    - apt
    - systemd
    - dbus
    - kmod
    - udev
  
  networking:
    - iproute2
    - netbase
    - ifupdown
  
  utilities:
    - ca-certificates
    - curl
    - wget
    - vim-tiny
    - less

# Packages to exclude (for minimization)
exclude_patterns:
  - "/usr/share/doc/*"
  - "/usr/share/man/*"
  - "/usr/share/info/*"
  - "/var/cache/apt/archives/*"
  - "/var/log/*.log"
  - "/tmp/*"
  - "/var/tmp/*"

# Verification requirements
verification:
  class: BUILD
  checks:
    - rootfs_boots_in_vm
    - essential_packages_present
    - no_unnecessary_files
    - size_within_limits
  
  size_limits:
    arm64: 200M
    amd64: 250M
    armhf: 180M
