# Layer 1: A95X F3 Air arm64 Debian root filesystem.
# build-rootfs.sh reads this file; it is the single source of the package set.
# DEBIAN_SUITE / DEBIAN_MIRROR / DEBIAN_SECURITY_MIRROR override the values
# below (for example to point at a snapshot.debian.org mirror).
debian:
  suite: bookworm
  mirror: http://deb.debian.org/debian
  security_mirror: http://security.debian.org/debian-security
  components: [main, contrib, non-free-firmware]
architecture: arm64
packages:
  # Kernel and DTBs come from the same package; see build/targets mainline_boot.
  kernel: [linux-image-arm64, initramfs-tools]
  # busybox serves the boot-status endpoint; systemd-resolved pairs with the
  # systemd-networkd DHCP configuration in rootfs-overlay.
  system: [busybox, ca-certificates, dbus, systemd-resolved]
  # Jellyfin MPV Shim runs on the target interpreter and Debian's libmpv.
  application_runtime: [python3, libmpv2]
hostname: ashipaos
service_user: ashipa
