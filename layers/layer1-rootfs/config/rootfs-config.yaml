# Layer 1: A95X F3 Air arm64 Debian root filesystem.
# build-rootfs.sh reads this file; it is the single source of the package set.
debian:
  # trixie (Debian 13): Jellyfin MPV Shim 3.0 needs libmpv >= 0.38; bookworm's
  # 0.35 rejects its options (evidence/amlogic/a95x-f3-air/boot-2026-09-24b/).
  suite: trixie
  # Every package comes from this fixed snapshot.debian.org point in time, so
  # the same commit always resolves the same package versions. Bump it
  # deliberately (e.g. for security fixes) and review the package diff in
  # output/evidence/layer1-packages.tsv.
  snapshot: 20260901T000000Z
  mirror: http://snapshot.debian.org/archive/debian/{snapshot}
  security_mirror: http://snapshot.debian.org/archive/debian-security/{snapshot}
  keyring: /usr/share/keyrings/debian-archive-keyring.gpg
  components: [main, contrib, non-free-firmware]
architecture: arm64
packages:
  # Kernel and DTBs come from the same package; see build/targets mainline_boot.
  kernel: [linux-image-arm64, initramfs-tools]
  # busybox serves the boot-status endpoint; systemd-resolved pairs with the
  # systemd-networkd DHCP configuration in rootfs-overlay. The box has no
  # battery-backed clock, so systemd-timesyncd sets the time over the network
  # (TLS to a Jellyfin server fails with a wrong clock).
  system: [busybox, ca-certificates, dbus, systemd-resolved, systemd-timesyncd]
  # Wi-Fi: the unit's module is a Realtek RTL8822CS (SDIO 024c:c822, driver
  # rtw_8822cs, firmware rtw88/rtw8822c_fw.bin); iwd joins the network
  # imported from wifi.txt on the boot partition; networkd runs DHCP.
  wifi: [firmware-realtek, wireless-regdb, iwd]
  # IR remote: the stock A95X keymap is loaded onto the meson-ir receiver.
  remote: [ir-keytable]
  # Jellyfin MPV Shim runs on the target interpreter and Debian's libmpv,
  # rendering through DRM/GBM/EGL (Mesa panfrost + meson display driver).
  application_runtime: [python3, libmpv2, libgl1-mesa-dri, libegl-mesa0, libgbm1, fonts-dejavu-core]
  # Kiosk compositor for the app (input via libinput) and its seat manager.
  kiosk: [cage, seatd]
hostname: ashipaos
service_user: ashipa
