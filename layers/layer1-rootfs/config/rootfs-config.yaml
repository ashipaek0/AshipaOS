# Layer 1 Configuration: Amlogic ARM64 Debian Root Filesystem
debian:
  suite: bookworm
  mirror: http://deb.debian.org/debian
  components: [main, contrib, non-free-firmware]
architectures: [arm64]
architecture_map:
  arm64: arm64
packages:
  base: [base-files, base-passwd, bash, bsdutils, coreutils, dash, debianutils, diffutils, dpkg, e2fsprogs, findutils, grep, gzip, hostname, init-system-helpers, libc6, login, ncurses-base, ncurses-bin, perl-base, sed, sensible-utils, sysvinit-utils, tar, util-linux]
  essential: [apt, systemd, dbus, kmod, udev]
  networking: [iproute2, netbase, ifupdown]
  utilities: [busybox, ca-certificates, curl, wget, vim-tiny, less]
kernel:
  packages:
    arm64: [linux-image-arm64]
  required_files: [/vmlinuz, /initrd.img]
initramfs:
  packages: [initramfs-tools]
  generate: true
  validate_versioned_files: true
exclude_patterns: ["/usr/share/doc/*", "/usr/share/man/*", "/usr/share/info/*", "/var/cache/apt/archives/*", "/var/log/*.log", "/tmp/*", "/var/tmp/*"]
verification:
  class: BUILD
  checks: [rootfs_boots_in_vm, essential_packages_present, kernel_and_initramfs_present, no_unnecessary_files, size_within_limits]
  size_limits:
    arm64: 200M
