# Layer 1 Configuration: Minimal Debian Root Filesystem
# Kernel/initramfs packages are installed in the target rootfs, never copied from the host.

debian:
  suite: bookworm
  mirror: http://deb.debian.org/debian
  components:
    - main
    - contrib
    - non-free-firmware

# Product names are mapped to Debian names by build-rootfs.sh.
architectures:
  - arm64
  - amd64
  - armhf
  - x86_64
architecture_map:
  x86_64: amd64
  amd64: amd64
  arm64: arm64
  armhf: armhf

# Packages to include in minimal rootfs
packages:
  base:
    - base-files
    - base-passwd
    - bash
    - bsdutils
    - coreutils
    - dash
    - debianutils
    - diffutils
    - dpkg
    - e2fsprogs
    - findutils
    - grep
    - gzip
    - hostname
    - init-system-helpers
    - libc6
    - login
    - ncurses-base
    - ncurses-bin
    - perl-base
    - sed
    - sensible-utils
    - sysvinit-utils
    - tar
    - util-linux

  essential:
    - apt
    - systemd
    - dbus
    - kmod
    - udev

  networking:
    - iproute2
    - netbase
    - ifupdown

  utilities:
    - busybox
    - ca-certificates
    - curl
    - wget
    - vim-tiny
    - less

# Debian target-rootfs policy. Each target installs its own kernel and tooling.
kernel:
  packages:
    amd64:
      - linux-image-amd64
    arm64:
      - linux-image-arm64
    armhf:
      - linux-image-armmp
  required_files:
    # Debian exposes these root-level symlinks to versioned files under /boot.
    - /vmlinuz
    - /initrd.img

initramfs:
  packages:
    - initramfs-tools
  generate: true
  validate_versioned_files: true

# Packages to exclude (for minimization)
exclude_patterns:
  - "/usr/share/doc/*"
  - "/usr/share/man/*"
  - "/usr/share/info/*"
  - "/var/cache/apt/archives/*"
  - "/var/log/*.log"
  - "/tmp/*"
  - "/var/tmp/*"

# Verification requirements
verification:
  class: BUILD
  checks:
    - rootfs_boots_in_vm
    - essential_packages_present
    - kernel_and_initramfs_present
    - no_unnecessary_files
    - size_within_limits

  size_limits:
    arm64: 200M
    amd64: 250M
    armhf: 180M
    x86_64: 250M
