# AshipaOS: bypass ALSA's software mixer (dmix) for the sole HDMI audio
# output. dmix failed to open its slave device on the exact unit
# (evidence/amlogic/a95x-f3-air/boot-2026-09-25b/: "pcm_dmix.c: unable to
# open slave" on every playback attempt, so Jellyfin MPV Shim always played
# with no sound). dmix exists to let several processes share one PCM device;
# this appliance only ever has one (the shim), so there is nothing to share
# and no reason to route through it. `plug` still handles any sample-rate or
# format conversion mpv needs.
#
# By card NAME, not index: card 0 on the exact unit is the XING WEI 2.4G USB
# remote/keyboard dongle's USB Audio Class interface (it advertises one even
# though it has no audio), and the real HDMI output (axg-sound-card,
# card ID "A95XF3AIR") only happened to land on card 1 because the dongle
# enumerated first (evidence/amlogic/a95x-f3-air/boot-2026-09-25c/,
# /proc/asound/cards). A fixed index breaks the moment USB enumeration order
# changes (a different port, a hub, a second USB device); the card ID string
# does not.
pcm.!default {
    type plug
    slave.pcm "hw:A95XF3AIR,0"
}
ctl.!default {
    type hw
    card A95XF3AIR
}
