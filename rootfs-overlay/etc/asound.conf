# AshipaOS: bypass ALSA's software mixer (dmix) for the sole HDMI audio
# output. dmix failed to open its slave device on the exact unit
# (evidence/amlogic/a95x-f3-air/boot-2026-09-25b/: "pcm_dmix.c: unable to
# open slave" on every playback attempt, so Jellyfin MPV Shim always played
# with no sound). dmix exists to let several processes share one PCM device;
# this appliance only ever has one (the shim), so there is nothing to share
# and no reason to route through it. `plug` still handles any sample-rate or
# format conversion mpv needs.
#
# PROVISIONAL: card 0 is assumed to be the board's only real audio device
# (HDMI via the g12a_tohdmitx ASoC card; nothing else registers a card unless
# a USB audio device is plugged in). ashipaos-boot-report now captures
# /proc/asound/cards and `aplay -l` to confirm this on the next boot.
pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}
ctl.!default {
    type hw
    card 0
}
