# Package names are resolved exclusively from the immutable Debian snapshot
# in the target configuration. configure-rootfs.sh records the exact resolved
# name/version/architecture set inside every build and release manifest.
packages:
  - ca-certificates
  - cage
  - connman
  - curl
  - dbus
  - grub-efi-amd64-bin
  - initramfs-tools
  - linux-image-amd64
  - mpv
  - nftables
  - openssh-server
  - python3
  - systemd-sysv
  - systemd-timesyncd
